<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quieres ser mi San Valentín?</title>
    <style>
        body {
            text-align: center;
            background-color: #ff4d6d;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* Contenedor con fondo negro */
        #contenedor {
            background-color: black;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            color: white;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.5);
        }

        #teAmoMensaje {
            font-size: 40px;
            font-weight: bold;
            margin-top: 50px;
        }

        #fecha {
            font-size: 20px;
            font-weight: bold;
            margin-top: 50px;
        }

        #osoImagen {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div id="contenedor">
        <div id="teAmoMensaje">¡Te amo con todo mi corazón! ❤️</div>
        <div id="fecha">Cassy, gracias por permitirme ser parte de tu vida, eres la personita más especial del mundo, y todo lo que podría pedir. <br> Te veo el 23, amor. 💌</div>
        <img id="osoImagen" src="osito.png" alt="Oso de San Valentín" width="300" />
    </div>
</body>
</html>
